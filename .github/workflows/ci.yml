---
name: CI

# Exactly the two gates that matter for this repo: nothing lands on main
# without passing, and a pull request shows its result before review.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push supersedes an in-flight run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # 24, matching the Dockerfile. Not a matrix: Node strips the
      # TypeScript itself and only does so without a flag from 23.6, so
      # older versions would not fail on a bug, they would fail on being
      # old. The Dockerfile pins the version that actually ships.
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # No `npm ci`: there are no dependencies and no lockfile. That is the
      # point of the project, and a test that silently started needing one
      # should fail here.
      - name: Check nothing crept into dependencies
        run: |
          if node -p "Object.keys(require('./package.json').dependencies ?? {}).length" | grep -qv '^0$'; then
            echo "::error::package.json has runtime dependencies. This project is meant to have none."
            exit 1
          fi

      - name: Run the tests
        run: npm test

      # Catches a source file that exists locally but was never committed.
      # CI checks out only what is in git, so a missing module simply does
      # not resolve - which is how the `check` and `fit` CLIs once shipped
      # without the module they import while every local run passed.
      - name: Every import resolves in a clean checkout
        run: node scripts/check-imports.mjs

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest

    # Deployments build this image from a tag on the target host, so a
    # broken Dockerfile is not found until a deploy is already half done.
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: docker build -t doorman:ci .

      # The image is what runs, so check the source actually made it in
      # rather than trusting COPY. Importing the CLIs instead would run
      # them, which is not what is being asked.
      - name: The source is present in the image
        run: |
          docker run --rm --entrypoint sh doorman:ci -c '
            test -f /app/src/cli/serve.ts &&
            test -f /app/src/media/analyse.ts &&
            test -f /app/src/web/public/index.html &&
            echo "entrypoint, media and UI assets all present"
          '

      - name: ffmpeg is available to the container
        run: docker run --rm --entrypoint ffprobe doorman:ci -version | head -1
