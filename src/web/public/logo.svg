  </defs>
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  <rect x="6.5" y="4.5" width="11" height="23" rx="5.5" fill="#fff"/>
  <circle cx="12" cy="10.6" r="2.9" fill="url(#lens)"/>
  <circle cx="11.1" cy="9.7" r="0.85" fill="#fff" fill-opacity="0.85"/>
